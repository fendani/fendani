
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fendani – Préfixes</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400;1,6..72,700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #29185e;
    --accent: #4b26c8;
    --success: #4b26c8;
    --warning: #9868d8;
    --bg: #f0edff;
    --card-bg: #ffffff;
    --text: #211747;
    --text-light: #88849b;
    --border: #e8e2fa;
    --shadow: 0 8px 28px rgba(41,24,94,.06);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "DM Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: var(--primary);
    color: white;
    text-align: center;
    padding: 42px 20px 55px;
    border-radius: 0 0 30px 30px;
}

header h1 {
    font: 700 clamp(32px,5vw,48px) "Newsreader",serif;
    margin: 0;
}

header p {
    opacity: .8;
    margin-top: 8px;
    font-size: 14px;
}

.container {
    width: min(100% - 32px, 1000px);
    margin: -25px auto 50px;
    position: relative;
}

.intro {
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    line-height: 1.7;
    font-size: 15px;
}

.search-box {
    background: white;
    padding: 8px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
}

#search {
    width: 100%;
    border: 0;
    outline: none;
    padding: 15px;
    background: #f8f7fd;
    border-radius: 10px;
    font: 16px "DM Sans";
    color: var(--text);
}

.alphabet {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    background: white;
    padding: 12px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.alphabet button {
    border: 0;
    background: #f0edff;
    color: var(--primary);
    border-radius: 7px;
    padding: 8px 11px;
    cursor: pointer;
    font-weight: 600;
}

.alphabet button.active,
.alphabet button:hover {
    background: var(--accent);
    color: white;
}

.counter {
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 18px;
}

#prefix-list {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 15px;
}

.prefix-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 20px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: .2s;
}

.prefix-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
}

.prefix-name {
    font: 700 27px "Newsreader",serif;
    color: var(--primary);
}

.prefix-origin {
    color: var(--warning);
    font-size: 13px;
    margin-top: 7px;
}

.prefix-meaning {
    color: var(--text);
    font-size: 15px;
    margin-top: 10px;
}

#detail {
    display: none;
}

.back {
    border: 0;
    background: var(--primary);
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    margin-bottom: 18px;
    cursor: pointer;
    font: 600 14px "DM Sans";
}

.detail-card {
    background: white;
    border-radius: 20px;
    padding: clamp(20px,4vw,38px);
    border-top: 5px solid var(--accent);
    box-shadow: var(--shadow);
}

.detail-name {
    font: 700 42px "Newsreader",serif;
    color: var(--primary);
}

.detail-section {
    background: #faf9ff;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 17px;
    margin-top: 17px;
    line-height: 1.7;
}

.detail-title {
    display: block;
    color: var(--text-light);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-bottom: 8px;
}

.example {
    border-left: 4px solid var(--warning);
    background: #fffdf5;
}

.example-word {
    font: 700 19px "Newsreader",serif;
    color: var(--primary);
}

.example-translation {
    color: var(--accent);
    margin-top: 5px;
}

.empty {
    text-align: center;
    padding: 35px;
    color: var(--text-light);
}

@media(max-width:600px) {
    #prefix-list {
        grid-template-columns: 1fr;
    }

    header {
        padding: 35px 16px 45px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Les préfixes</h1>
    <p>Fendani · Dictionnaire bilingue français-caló</p>
</header>

<div class="container">

    <div class="search-box" id="search-box">
        <input
            id="search"
            type="text"
            placeholder="Rechercher un préfixe ou un suffixe : ajouter - avant le préfixe. Par ex: (anti-)"
            onkeydown="if(event.key === 'Enter') chercherEtOuvrir()"
        >
    </div>

    <div id="detail">
        <button class="back" onclick="retour()">
            ← Retour à la recherche
        </button>

        <div class="detail-card" id="detail-content"></div>
    </div>

</div>

<script src="prefixes.js"></script>

<script>


function echapper(texte) {
    return String(texte ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[c]);
}

// Autorise l'italique et le gras
function afficherTexte(texte) {
    return echapper(texte)
        .replace(/&lt;em&gt;/g, "<em>")
        .replace(/&lt;\/em&gt;/g, "</em>")
        .replace(/&lt;strong&gt;/g, "<strong>")
        .replace(/&lt;\/strong&gt;/g, "</strong>");
}

// Recherche et ouverture de la fiche
function chercherEtOuvrir() {

    const recherche = document
        .getElementById("search")
        .value.trim().toLowerCase();

    if (!recherche) return;

    const p = prefixes.find(x =>
        x.prefixe.toLowerCase() === recherche
    );

    if (!p) {
        alert("Aucun préfixe ou suffixe trouvé.");
        return;
    }

    window.location.hash =
        "/prefixe/" + encodeURIComponent(p.prefixe);
}

// Routeur
function gererNavigation() {

    const hash = window.location.hash;

    if (hash.startsWith("#/prefixe/")) {

        const valeur = decodeURIComponent(
            hash.slice("#/prefixe/".length)
        );

        const p = prefixes.find(
            x => x.prefixe === valeur
        );

        if (p) {
            ouvrir(p);
        } else {
            retour();
        }

    } else {

        document.getElementById("detail").style.display = "none";
        document.getElementById("search-box").style.display = "block";

    }
}

// Affichage de la fiche
function ouvrir(p) {

    document.getElementById("search-box").style.display = "none";
    document.getElementById("detail").style.display = "block";

    document.title = p.prefixe + " - Morphologie Fendani";

    document.getElementById("detail-content").innerHTML = `

        <div class="detail-name">
            ${afficherTexte(p.prefixe)}
        </div>

        ${p.traduction?.trim() ? `
            <div style="
                font-family: 'Newsreader', serif;
                font-size: 22px;
                color: var(--accent);
                font-weight: 600;
                margin-top: 4px;
                margin-bottom: 20px;
            ">
                ${afficherTexte(p.traduction)}
            </div>
        ` : ""}

        ${p.origine?.trim() ? `
            <div class="detail-section">
                <span class="detail-title">Origine étymologique</span>
                ${afficherTexte(p.origine)}
            </div>
        ` : ""}

        ${p.signification?.trim() ? `
            <div class="detail-section">
                <span class="detail-title">Signification</span>
                ${afficherTexte(p.signification)}
            </div>
        ` : ""}

        ${p.fonction?.trim() ? `
            <div class="detail-section">
                <span class="detail-title">Fonction morphologique</span>
                ${afficherTexte(p.fonction)}
            </div>
        ` : ""}

        ${p.exemples?.length ? `
            <div class="detail-section example">
                <span class="detail-title">Exemples de formation</span>

                ${p.exemples.map(e => `
                    <div style="margin-bottom:18px">

                        ${e.mot?.trim() ? `
                            <div class="example-word">
                                ${afficherTexte(e.mot)}
                            </div>
                        ` : ""}

                        ${e.decomposition?.trim() ? `
                            <div style="font-size:14px;color:var(--text-light);">
                                ${afficherTexte(e.decomposition)}
                            </div>
                        ` : ""}

                        ${e.traduction?.trim() ? `
                            <div class="example-translation">
                                ➔ ${afficherTexte(e.traduction)}
                            </div>
                        ` : ""}

                    </div>
                `).join("")}
            </div>
        ` : ""}

        ${p.remarques?.trim() ? `
            <div class="detail-section">
                <span class="detail-title">Remarques</span>
                ${afficherTexte(p.remarques)}
            </div>
        ` : ""}

    `;

    window.scrollTo({top:0, behavior:"smooth"});
}

// Retour à la recherche
function retour() {
    window.location.hash = "";
    document.getElementById("search").value = "";
}

// Navigation avec les boutons précédent/suivant
window.addEventListener("hashchange", gererNavigation);

// Initialisation
document.addEventListener("DOMContentLoaded", () => {

    if (typeof prefixes === "undefined") {
        document.getElementById("detail-content").textContent =
            "Erreur : impossible de charger prefixes.js.";
        return;
    }

    gererNavigation();

});

</script>

</body>
</html>
