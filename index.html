<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fendani • Dictionnaire français-caló</title>

  <style>
   @import url('https://fonts.googleapis.com/css2?family=Bellota+Text:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Figtree:ital,wght@0,300..900;1,300..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300&family=Manrope:wght@200..800&display=swap');

    :root {
      --bg: #ffffff;
      --text: #0d0d0d;
      --muted: #8c8c8c;
      --line: #efefef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
  background-color: #ffffff;
  background-image: none;
  color: var(--text);
  font-family: "Inter", sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.015em;
}
    a {
      color: inherit;
      text-decoration: none;
    }


.word-image {
  position: fixed;
  top: 90px;
  right: 0;
  width: 400px;
  height: calc(100vh - 90px);
  background-position: center;
  background-size: 400px auto;
  background-repeat: no-repeat;
  z-index: 5;
}

.play-audio {
  display: inline-block;
  vertical-align: middle;
  float: none;
  margin-right: 6px;
}

.word-image.no-image {
  display: none;
}

body.single-mode main {
  width: 100%;
  max-width: none;
  margin-left: 0;
  margin-right: 0;
  padding: 160px 40px 20px;
  justify-content: flex-start;
  height: auto;
  min-height: 100vh;
}

body.single-mode.has-image main {
  width: calc(100% - 400px);
  margin-right: 400px;
}

.photo-credit {
  position: absolute;
  bottom: 10px;
  right: 10px;
  z-index: 10;
  color: white;
  font-family: "Inter", monospace;
  font-size: 8px;
  letter-spacing: 0.08em;
  pointer-events: none;
}

body.single-mode main {
  width: calc(100% - 400px);
  max-width: none;
  margin-left: 0;
  margin-right: 400px;
  padding: 160px 40px 20px;
  justify-content: flex-start;
  height: auto;
  min-height: 100vh;
}

.play-audio {
  background: transparent;
  border: none;
  cursor: pointer;
  width: 24px;
  height: 24px;
}
.play-audio img {
  width: 18px;
  vertical-align: -5px;
}

.play-audio:hover {
  transform: scale(1.05);
  background: #FFFFFF;
}

.play-audio:active {
  transform: scale(1.12);
}

   header {
  width: 100%;
  height: 90px;
  padding: 0 60px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  position: fixed;
  top: -2px;
  background: rgba(255, 255, 255);
  backdrop-filter: blur(16px);
  z-index: 1000;
}

  .logo {
  font-family: "Newsreader", serif;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.03em;
  transform: translateX(-20px);
}

    .header-search-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .header-search {
      border: 0;
      border-bottom: none;
      background: transparent;
      font-family: "Instrument Serif", serif;
      font-size: 18px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      outline: none;
      padding-bottom: 2px;
      color: var(--text);
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .action-link, nav a {
      font-family: "Newsreader", monospace;
      font-size: 10px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      background: none;
      border: 0;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .action-link:hover, nav a:hover {
      color: var(--text);
    }

    nav a.active {
      color: var(--text);
    }

    .header-counter {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      font-family: "Newsreader", monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1;
    }

    .header-counter .counter-number {
      font-size: 10px;
      font-weight: 800;
      color: var(--text);
    }

    .header-counter .counter-label {
      font-family: "Newsreader", sans-serif;
      font-size: 10px;
      font-weight: 300;
      color: var(--muted);
    }

    main {
      max-width: 960px;
      height: 100vh;
      margin: 0 auto;
      padding: 100px 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: none;
    }

    h1 {
      font-family: "Newsreader";
      font-size: 48px;
      line-height: 0.92;
      font-weight: 300;
      font-style: italic;
      margin-bottom: 12px;
      color: #005D4C;
    }

    .home-directory {
      margin-top: 24px;
      position: relative;
    }

    .word-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 240px);
      overflow-y: auto;
    }

    .word-card {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: opacity 0.3s ease, padding-left 0.3s ease;
    }

    .word-card:hover {
      opacity: 0.4;
      padding-left: 10px;
    }

    .word-letter {
      font-family: "Inter", monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .word-header-bar {
      display: flex;
      align-items: baseline;
      width: 100%;
    }

    .word-main {
      display: flex;
      align-items: baseline;
      gap: 20px;
    }

    .word-fr {
      color: #C8B89A;
      font-family: "Newsreader", serif;
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.5px;
    }

    .word-name {
      color: #000000;
      font-family: "Newsreader", serif;
      font-size: 32px;
      font-weight: 100;
    }

    .word-nav-links {
      display: none;
      gap: 20px;
      margin-left: 30px;
    }

    .word-nav-links a {
      font-family: "Newsreader", monospace;
      font-size: 12px;
      color: var(--muted);
      transition: color 0.3s ease;
    }

    .word-nav-links a:hover {
      color: var(--text);
    }

    /* Styles pour les suggestions mobiles instantanées */
    .search-suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      z-index: 1200;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      border-radius: 4px;
      margin-top: 5px;
    }

    .search-suggestion-item {
      padding: 10px 15px;
      font-family: "Newsreader", serif;
      font-size: 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
    }

    .search-suggestion-item:hover {
      background: #f9f9f9;
    }

    .search-suggestion-item span.fr {
      color: #005D4C;
      font-weight: 500;
    }

    .search-suggestion-item span.cal {
      color: var(--muted);
    }

@media (max-width: 768px) {
  header {
    height: auto;
    padding: 15px 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
    width: 100% !important;
  }

  .logo {
    transform: none;
    text-align: center;
  }

  .header-search-container {
    width: 100% !important;
    padding: 0 10px;
  }

  .header-search {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    font-size: 22px; 
    border-bottom: 1px solid var(--line) !important; 
    padding-bottom: 5px;
  }

  .header-actions {
    align-items: center;
    width: 100%;
  }

  main {
    height: auto !important; 
    min-height: auto !important;
    padding: 20px 20px 40px !important;
  }

  .word-main {
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }

  .word-name {
    font-size: 28px;
  }

  .word-fr {
    font-size: 18px;
  }
}
    
    body.single-mode .hero-section {
      display: none !important;
    }

    body.single-mode .home-directory {
      display: none !important;
    }

   body.single-mode main {
  width: calc(100% - 400px);
  max-width: none;
  margin-left: 0;
  margin-right: 400px;
  padding: 160px 40px 20px;
  justify-content: flex-start;
}

    body.single-mode .word-list {
      max-height: none;
      overflow-y: visible;
      width: 100%;
    }

    body.single-mode .word-list .word:not(.active-single) {
      display: none !important;
    }

    body.single-mode .word-card {
      opacity: 1 !important;
      cursor: default;
      border-bottom: none;
      padding: 0 !important;
      width: 100%;
    }

    body.single-mode .word-header-bar {
      border-bottom: 1px solid var(--text);
      padding-bottom: 18px;
      height: 70px; 
      align-items: flex-end;
    }

    body.single-mode .word-name {
      font-size: clamp(38px, 5vw, 56px);
      line-height: 1;
    }

    body.single-mode .word-nav-links {
      display: flex;
      margin-left: auto;
    }

    .details {
      display: none;
      margin-top: 32px;
    }

    body.single-mode .details {
      display: block;
    }

    .monograph-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      align-items: start;
    }

    .mono-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-row {
      font-family: "Newsreader";
      font-size: 14px;
      line-height: 1.23;
      color: var(--text);
    }

    .detail-label {
      font-family: "Newsreader";
      font-size: 10px;
      font-weight: 350;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: black;
      display: block;
      margin-bottom: 7px;
    }

#mainSearch,
#mainSearch:focus {
  display: block;
  width: 100%;
  max-width: 100%;
  margin: 20px auto;
  text-align: center;
  font-family: "Newsreader", serif;
  font-size: 32px;
  font-weight: 100;
  border: none !important;
  box-shadow: none !important;
  outline: none !important;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
}

.hero-section {
  display: none !important;
}

#mainSearch::-webkit-search-cancel-button,
#mainSearch::-webkit-search-decoration {
  display: none;
  -webkit-appearance: none;
  appearance: none;
}

    .word-footer-info {
      display: none;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-family: "Newsreader", monospace;
      font-size: 8px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    body.single-mode .word-footer-info {
      display: flex;
    }

    .empty {
      padding: 30px 0;
      text-align: center;
      font-family: "Newsreader", serif;
      font-style: italic;
      font-weight: 200;
      color: var(--muted);
      font-size: 19px;
    }

    @media (max-width: 768px) {
      body.single-mode main {
        width: 100%;
        margin-right: 0;
        padding: 120px 20px 20px;
      }
    }

    .compact-search {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      z-index: 1100;
    }

    #compactSearchInput {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      text-align: center;
      font-family: "Newsreader", serif;
      font-size: 18px;
    }

    #compactSearchInput::-webkit-search-cancel-button {
      display: none;
      -webkit-appearance: none;
      appearance: none;
    }

    @media (max-width: 768px) {
      .compact-search {
        width: 70% !important;
        left: 55% !important;
      }
      #compactSearchInput {
        font-size: 15px !important;
      }
      #mainSearch {
        font-size: 20px !important;
        width: 100% !important;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="compact-search" id="compactSearch">
      <input type="search" id="compactSearchInput" placeholder="écrire un mot français..." autocomplete="off">
      <div id="compactSuggestions" class="search-suggestions"></div>
    </div>
    <a href="index.html" class="logo">fendani</a>
    
    <div class="header-actions">
      <nav>
        <a href="index.html" class="active">FR</a>
        <a href="index-fr.html">TOUS LES MOTS</a>
      </nav>
      <div class="header-counter">
        <span class="counter-number" id="totalWords">—</span>
        <span class="counter-label">entrées</span>
      </div>
    </div>
  </header>

  <main>
    <div id="wordImage" class="word-image">
      <div id="photoCredit" class="photo-credit"></div>
    </div>

    <section class="home-directory" id="homeDirectory">
      <input type="search" id="mainSearch" class="header-search" placeholder="écrire un mot français..." autocomplete="off">
      <div id="mainSuggestions" class="search-suggestions"></div>
    </section>

    <ul class="word-list" id="wordList"></ul>
    <div class="empty" id="empty" style="display:none;">Aucun écho trouvé.</div>
    <div class="error" id="error" style="display:none;">Le dictionnaire (`dictionary.js`) est introuvable.</div>
  </main>

  <script src="dictionary.js"></script>

  <script>
    const wordList = document.getElementById("wordList");
    const mainSearch = document.getElementById("mainSearch");
    const mainSuggestions = document.getElementById("mainSuggestions");
    const compactSearchInput = document.getElementById("compactSearchInput");
    const compactSuggestions = document.getElementById("compactSuggestions");
    const homeDirectory = document.getElementById("homeDirectory");
    const empty = document.getElementById("empty");
    const error = document.getElementById("error");
    const totalWords = document.getElementById("totalWords");

    if (typeof dictionary === "undefined") {
      error.style.display = "block";
    } else {
      totalWords.textContent = dictionary.reduce((total, mot) => {
        const boldWords = (mot.senses || []).reduce((count, sense) => {
          const html = sense.b || "";
          const matches = html.match(/<(?:strong|b)\b[^>]*>[\s\S]*?<\/(?:strong|b)>/gi) || [];
          return count + matches.reduce((sum, match) => {
            const text = match.replace(/<[^>]*>/g, "").trim();
            return sum + (text.match(/\b[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
          }, 0);
        }, 0);
        return total + 1 + boldWords;
      }, 0);

      function escapeHTML(value) {
        if (value === undefined || value === null) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function slugify(text) {
        return String(text || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function normalizeWord(text) {
        return String(text || "")
          .trim()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function renderDetails(mot) {
        let col1HTML = "";
        let col2HTML = "";
        if (mot.type) col2HTML += `<div class="detail-row"><span class="detail-label">Nature & Genre</span>${escapeHTML(mot.type)}${mot.gender ? " · " + escapeHTML(mot.gender) : ""}</div>`;
        if (mot.domain) {
          col2HTML += `<div class="detail-row"><span class="detail-label">Domaine</span>${escapeHTML(mot.domain)}</div>`;
        }
        if (mot.phonetic) col2HTML += `<div class="detail-row"><span class="detail-label">Prononciation</span>${escapeHTML(mot.phonetic)}</div>`;
        if (mot.audio1 || mot.audio2) {
          col2HTML += `<div class="detail-row audio-row"><span class="detail-label">Audio</span>`;
          if (mot.audio1) col2HTML += `<button class="play-audio" onclick="new Audio('${escapeHTML(mot.audio1)}').play()"><img src="logo.svg" alt=""></button>`;
          if (mot.audio2) col2HTML += `<button class="play-audio" onclick="new Audio('${escapeHTML(mot.audio2)}').play()">🎓</button>`;
          col2HTML += `</div>`;
        }
        if (mot.definition) {
          col1HTML += `<div class="detail-row"><span class="detail-label">Définition</span>${mot.definition}</div>`;
        }
        return `<div class="monograph-grid"><div class="mono-col">${col1HTML}</div><div class="mono-col">${col2HTML}</div></div>`;
      }

      const sortedDictionary = [...dictionary].sort((a, b) =>
        (a.fr || "").localeCompare(b.fr || "", "fr", { sensitivity: "base" })
      );

      function buildDOM(list) {
        wordList.innerHTML = "";
        empty.style.display = list.length ? "none" : "block";

        list.forEach((mot, index) => {
          const li = document.createElement("li");
          li.className = "word";
          const slug = slugify(mot.b || `mot-${index}`);
          li.dataset.slug = slug;
          const firstLetter = (mot.fr || mot.b || "").charAt(0).toUpperCase();

          li.innerHTML = `
            <div class="word-card">
              <div class="word-header-bar">
                <div class="word-main">
                  <span class="word-letter">${escapeHTML(firstLetter)}</span>
                  <span class="word-fr">${escapeHTML(mot.fr)}</span>
                  <span class="word-name">${escapeHTML(mot.b)}</span>
                </div>
              </div>
              <div class="details">${renderDetails(mot)}</div>
            </div>
          `;

          li.querySelector('.word-card').addEventListener("click", () => {
            navigateToWord(slug);
          });
          wordList.appendChild(li);
        });
      }

      function navigateToWord(slug) {
        history.pushState({ mot: slug }, "", `?mot=${slug}`);
        handleRoute();
      }

      function handleRoute() {
        const params = new URLSearchParams(window.location.search);
        const currentMotSlug = params.get('mot');
        const allWords = document.querySelectorAll('.word');

        if (currentMotSlug) {
          let found = false;
          if (wordList.children.length === 0) buildDOM(sortedDictionary);

          allWords.forEach(w => {
            if (w.dataset.slug === currentMotSlug) {
              w.classList.add('active-single');
              found = true;
            } else {
              w.classList.remove('active-single');
            }
          });

          if (found) {
            document.body.classList.add('single-mode');
            homeDirectory.style.display = "none";
            empty.style.display = "none";

            const currentWord = sortedDictionary.find(mot => slugify(mot.b) === currentMotSlug);
            const wordImage = document.getElementById("wordImage");
            const photoCredit = document.getElementById("photoCredit");

            if (currentWord?.image?.trim()) {
              wordImage.style.backgroundImage = `url("${currentWord.image}")`;
              wordImage.classList.remove("no-image");
              document.body.classList.add("has-image");
              photoCredit.textContent = currentWord.credit || "";
            } else {
              wordImage.style.backgroundImage = "none";
              wordImage.classList.add("no-image");
              document.body.classList.remove("has-image");
              photoCredit.textContent = "";
            }
            return;
          }
        }

        document.body.classList.remove('single-mode');
        allWords.forEach(w => w.classList.remove('active-single'));
        wordList.innerHTML = "";
        homeDirectory.style.display = "block";
        mainSearch.value = "";
        if (compactSearchInput) compactSearchInput.value = "";
      }

      window.addEventListener('popstate', handleRoute);
      buildDOM(sortedDictionary);
      handleRoute();

      // Moteur de recherche instantané optimisé mobile
      function setupInstantSearch(inputEl, suggestionsEl) {
        inputEl.addEventListener("input", () => {
          const query = normalizeWord(inputEl.value);
          suggestionsEl.innerHTML = "";

          if (!query) {
            suggestionsEl.style.display = "none";
            return;
          }

          const matches = sortedDictionary.filter(mot => 
            normalizeWord(mot.fr).includes(query) || normalizeWord(mot.b).includes(query)
          ).slice(0, 5); // Limiter à 5 suggestions pour la vitesse mobile

          if (matches.length > 0) {
            suggestionsEl.style.display = "block";
            matches.forEach(mot => {
              const div = document.createElement("div");
              div.className = "search-suggestion-item";
              div.innerHTML = `<span class="fr">${escapeHTML(mot.fr)}</span> <span class="cal">${escapeHTML(mot.b)}</span>`;
              div.addEventListener("click", () => {
                window.location.href = `index.html?mot=${encodeURIComponent(slugify(mot.b))}`;
              });
              suggestionsEl.appendChild(div);
            });
          } else {
            suggestionsEl.style.display = "none";
          }
        });

        // Fermer les suggestions si on clique ailleurs
        document.addEventListener("click", (e) => {
          if (!inputEl.contains(e.target) && !suggestionsEl.contains(e.target)) {
            suggestionsEl.style.display = "none";
          }
        });
      }

      setupInstantSearch(mainSearch, mainSuggestions);
      setupInstantSearch(compactSearchInput, compactSuggestions);
    }

    const compactSearch = document.getElementById("compactSearch");
    function updateCompactSearch() {
      compactSearch.style.display = document.body.classList.contains("single-mode") ? "block" : "none";
    }

    const previousHandleRoute = handleRoute;
    handleRoute = function () {
      previousHandleRoute();
      updateCompactSearch();
    };
    updateCompactSearch();
  </script>
</body>
</html>
