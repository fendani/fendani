<svg xmlns="http://w3.org" viewBox="0 0 100 100" width="100" height="100">
  <!-- Base cubique noire typique du trophée -->
  <rect x="25" y="70" width="50" height="18" rx="2" fill="black"/>
  <rect x="22" y="84" width="56" height="4" rx="1" fill="black"/>
  
  <!-- Bras acoustique et support mécanique -->
  <path d="M50 70 V62 C50 55 68 55 68 42 V35" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="62" r="3" fill="black"/>

  <!-- Le grand pavillon circulaire doré (Grammy Style) -->
  <!-- Corps du pavillon -->
  <path d="M68 35 C52 35 25 22 25 10 C45 10 68 22 68 35 Z" fill="#E5A93C" stroke="black" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Grande ouverture du pavillon (face avant) -->
  <ellipse cx="25" cy="10" rx="4" ry="10" transform="rotate(-30 25 10)" fill="#F4D068" stroke="black" stroke-width="3"/>
  
  <!-- Stries intérieures rétro du pavillon -->
  <path d="M38 18 C46 22 54 24 64 26" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M43 14 C50 17 58 19 66 20" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>

