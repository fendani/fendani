<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nettoyeur Tolérant - Dictionnaire</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f4f6f9; color: #333; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 250px; font-family: monospace; margin: 15px 0; padding: 10px; box-sizing: border-box; }
        button { background: #e67e22; color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #d35400; }
        .rapport { margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 4px solid #2ecc71; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>🧹 Nettoyeur de Dictionnaire (Version Anti-Bug)</h2>
    <p>Collez vos données JSON ici. Cette version répare automatiquement les erreurs de crochets ou de virgules manquantes.</p>
    
    <textarea id="jsonInput" placeholder="Collez votre JSON ici..."></textarea>
    
    <button onclick="nettoyerTolérant()">Réparer, Nettoyer et Télécharger</button>
    
    <div id="rapport" class="rapport"></div>
</div>

<script>
function nettoyerTolérant() {
    const input = document.getElementById('jsonInput').value;
    const rapportDiv = document.getElementById('rapport');
    
    if(!input.trim()) {
        alert("La zone de texte est vide.");
        return;
    }

    // Extraction manuelle des blocs {} sans passer par un JSON.parse global rigide
    const regexBlocs = /\{[\s\S]*?\}/g;
    const matches = input.match(regexBlocs);

    if(!matches || matches.length === 0) {
        alert("Impossible de détecter des fiches de mots valides dans votre texte. Assurez-vous d'avoir bien généré du JSON au préalable.");
        return;
    }

    let rawData = [];
    matches.forEach(blocStr => {
        try {
            // On nettoie les petites virgules traînantes spécifiques à chaque bloc
            let nettoyeBloc = blocStr.replace(/,\s*\}/, '}');
            let obj = JSON.parse(nettoyeBloc);
            rawData.push(obj);
        } catch(e) {
            // On ignore silencieusement les rares blocs totalement corrompus
        }
    });

    let initialCount = rawData.length;
    let vus = {};
    let nettoye = [];
    let doublonsSupprimes = 0;
    let fusionsAlimentees = 0;

    rawData.forEach(item => {
        if (!item.mot || item.mot.trim() === "" || item.mot.includes("DICTIONNAIRE BILINGUE")) {
            doublonsSupprimes++;
            return; 
        }

        let motCle = item.mot.trim().toLowerCase();

        if (vus[motCle]) {
            let existant = vus[motCle];
            
            if (item.traduction && !existant.traduction.includes(item.traduction)) {
                existant.traduction += " ; " + item.traduction;
                fusionsAlimentees++;
            }
            if (item.etymologie && item.etymologie !== existant.etymologie) {
                if (!existant.etymologie) {
                    existant.etymologie = item.etymologie;
                } else if (!existant.etymologie.includes(item.etymologie)) {
                    existant.etymologie += " | " + item.etymologie;
                }
                fusionsAlimentees++;
            }
            doublonsSupprimes++;
        } else {
            item.mot = item.mot.trim();
            if(item.nature) item.nature = item.nature.trim();
            if(item.etymologie) item.etymologie = item.etymologie.trim();
            if(item.traduction) item.traduction = item.traduction.trim();
            
            vus[motCle] = item;
            nettoye.push(item);
        }
    });

    // Re-calcul des ID propres
    nettoye.forEach((item, index) => {
        item.id = index + 1;
    });

    // Écriture du fichier final parfaitement structuré
    const jsonString = JSON.stringify(nettoye, null, 2);
    const blob = new Blob([jsonString], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `dictionnaire_parfait.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    rapportDiv.style.display = "block";
    rapportDiv.innerHTML = `
        <h3>📊 Base de données réparée et nettoyée !</h3>
        <ul>
            <li>Mots valides récupérés : <b>${initialCount}</b></li>
            <li>Doublons et en-têtes nettoyés : <b>${doublonsSupprimes}</b></li>
            <li>Fiches cumulées et enrichies : <b>${fusionsAlimentees}</b></li>
            <li><b>Mots uniques prêts pour votre site final : ${nettoye.length}</b></li>
        </ul>
        <p>Le fichier <strong>dictionnaire_parfait.json</strong> est téléchargé.</p>
    `;
}
</script>

</body>
</html>
