.play-audio {

}

    /* Header minimaliste avec recherche centrée */
   header {
  width: 100%;
  height: 90px;
  padding: 0 60px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  position: fixed;
  top: -2px;
  background: rgba(255, 255, 255);
  backdrop-filter: blur(16px);
  z-index: 1000;
}

  .logo {
  font-family: "Newsreader", serif;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.03em;
  transform: translateX(-20px);
}

    .header-search-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .header-search {
      border: 0;
      border-bottom: none;
      background: transparent;
      font-family: "Instrument Serif", serif;
      font-size: 18px;
      font-style: regular;
      width: 100%;
      max-width: 280px;
      text-align: center;
      outline: none;
      padding-bottom: 2px;
      color: var(--text);
      transition: border-color 0.3s;
    }

    .header-search:focus {
      border-color: var(--text);
    }

    .header-search::placeholder {
      color: var(--muted);
      opacity: 0.5;
    }

    /* Partie droite du header : empilement des boutons et du compteur */
    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .action-link, nav a {
      font-family: "Newsreader", monospace;
      font-size: 10px;
font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      background: none;
      border: 0;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .action-link:hover, nav a:hover {
  color: var(--text);
}

nav a.active {
  color: var(--text);
}


    .header-counter {
      display: flex;
      flex-direction: column; /* Empile le nombre et le mot verticalement */
      align-items: flex-end;   /* Aligne tout bien à droite */
      gap: 2px;                /* Espace entre les deux lignes */
      font-family: "Newsreader", monospace;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1;
    }

    .header-counter .counter-number {
      font-size: 10px;
      font-weight: 800;
      color: var(--text);
    }

    .header-counter .counter-label {
font-family: "Newsreader", sans-serif;
      font-size: 10px;
font-weight: 300;
      color: var(--muted);
    }

    /* Corps principal */
    main {
      max-width: 960px;
      height: 100vh;
      margin: 0 auto;
      padding: 100px 30px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Hero de la page d'accueil */
    .hero-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .eyebrow {
      font-family: "Bellota Text", monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--muted);
    }

    h1 {
  font-family: "Newsreader";
  font-size: 48px;
  line-height: 0.92;
  font-weight: 300;
  font-style: italic;
  margin-bottom: 12px;
  color: #005D4C;
}

    .hero-subtitle {
      font-family: "Instrument Serif", serif;
      font-size: 21px;
      font-style: regular;
      color: black;
      max-width: 600px;
      line-height: 1.3;
    }

    .home-directory {
      margin-top: 24px;
    }

    .directory-label {
      font-family: "Bellota Text", monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .alphabet-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }


    .letter-pill {
      font-family: "Bellota Text", monospace;
      font-size: 10px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .letter-pill:hover, .letter-pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    /* Liste des résultats */
    .word-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 240px);
      overflow-y: auto;
    }

    .word-card {
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: opacity 0.3s ease, padding-left 0.3s ease;
    }

    .word-card:hover {
      opacity: 0.4;
      padding-left: 10px;
    }


    .word-letter {
      font-family: "Inter", monospace;
      font-size: 10px;
      color: var(--muted);
    }

.word-header-bar {
  display: flex;
  align-items: baseline;
  width: 100%;
}

.word-main {
  display: flex;
  align-items: baseline;
  gap: 20px;
}

.word-fr {
  color: #C8B89A;
  font-family: "Newsreader", serif;
  font-size: 24px;
font-weight: 400;
letter-spacing: -0.5px;
  font-style: regular;
}

.word-name {
  color: #000000;
  font-family: "Newsreader", serif;
  font-size: 32px;
font-weight: 100;
letter-spacing: 0px;

}

.word-nav-links {
  display: none;
  gap: 20px;
  margin-left: 30px;
}




    .word-nav-links {
      display: none;
      gap: 20px;
    }

    .word-nav-links a {
      font-family: "Newsreader", monospace;

      font-style: regular;
      color: var(--muted);
      transition: color 0.3s ease;
    }

    .word-nav-links a:hover {

  body.single-mode .word-fr {
    font-size: 19px;
  }

  body.single-mode .word-nav-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    margin: 0;
  }

  body.single-mode .word-nav-links a {
    display: inline-flex;
    align-items: center;
    min-height: 36px;
    font-size: 12px;
  }

  /* Image : affichée après le contenu de la fiche */
  body.single-mode .word-image:not(.no-image) {
    position: relative !important;
    inset: auto !important;
    order: 2;
    display: block;
    width: 100% !important;
    height: auto !important;
    aspect-ratio: 4 / 3;
    min-height: 190px;
    max-height: 340px;
    margin: 26px 0 0;
    background-position: center;
    background-size: cover !important;
    background-repeat: no-repeat;
    border-radius: 2px;
    overflow: hidden;
  }

  body.single-mode .word-image.no-image {
    display: none !important;
  }

  .photo-credit {
    right: 10px;
    bottom: 10px;
    font-size: 8px;
  }

  /* Définitions et informations */
  .details {
    display: none;
    width: 100%;
    margin-top: 24px;
  }

  body.single-mode .details {
    display: block;
  }

  .monograph-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 30px;
    align-items: start;
    width: 100%;
  }

  .mono-col {
    display: flex;
    flex-direction: column;
    gap: 22px;
    min-width: 0;
  }

  .detail-row {
    min-width: 0;
    margin-bottom: 0;
    font-size: 16px;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }

  .detail-label {
    display: block;
    margin-bottom: 8px;
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.16em;
  }

  .detail-row a {
    max-width: 100%;
    overflow-wrap: anywhere;
  }

  .related {
    display: inline;
    line-height: 2.2;
  }

  .related span {
    margin: 3px 5px 3px 0;
    padding: 5px 9px;
    font-size: 11px;
  }

  /* Audio : commandes plus faciles à toucher */
  .play-audio {
    display: inline-flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    margin-right: 6px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #f5f5f3;
    cursor: pointer;
    vertical-align: middle;
    -webkit-tap-highlight-color: transparent;
  }

  .play-audio img {
    display: block;
    width: 18px;
    height: 18px;
    object-fit: contain;
  }

  .play-audio:active {
    transform: scale(0.96);
    background: #eaeae7;
  }

  .audio-row audio {
    max-width: 100%;
  }

  /* Pied de fiche */
  .word-footer-info {
    display: none;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 30px;
    padding-top: 14px;
    font-size: 8px;
    line-height: 1.5;
  }

  body.single-mode .word-footer-info {
    display: flex;
  }

  /* États vides et erreurs */
  .empty,
  .error {
    padding: 28px 0;
    font-size: 19px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  /* Évite les débordements des mots longs */
  .word,
  .word-card,
  .details,
  .monograph-grid,
  .mono-col {
    min-width: 0;
    max-width: 100%;
  }

  /* Respecte les préférences d'accessibilité */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }
}

/* Petits écrans */
@media (max-width: 380px) {
  header {
    padding-right: 12px;
    padding-left: 12px;
    gap: 8px;
  }

  .header-actions {
    gap: 8px;
  }

  header nav {
    gap: 7px;
  }

  .action-link,
  nav a {
    font-size: 8px;
    letter-spacing: 0.04em;
  }

  .header-counter .counter-number,
  .header-counter .counter-label {
    font-size: 8px;
  }

  body.single-mode main,
  body.single-mode.has-image main,
  body.single-mode:not(.has-image) main {
    padding-right: 16px !important;
    padding-left: 16px !important;
  }

  .word-name {
    font-size: 27px;
  }
} 
    /* FENDANI — Visibilité du mot principal */
@media (max-width: 768px) {
  body.single-mode .word-header-bar {
    align-items: stretch;
    padding-top: 12px;
    padding-bottom: 22px;
    gap: 18px;
    min-height: 0;
    height: auto;
  }

  body.single-mode .word-main {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: baseline;
    column-gap: 10px;
    row-gap: 7px;
    width: 100%;
  }

  body.single-mode .word-letter {
    grid-column: 1;
    grid-row: 1;
    padding-top: 4px;
  }

  body.single-mode .word-fr {
    grid-column: 2;
    grid-row: 1;
    font-size: 19px;
    line-height: 1.35;
  }

  body.single-mode .word-name {
    grid-column: 1 / -1;
    grid-row: 2;
    display: block;
    width: 100%;
    max-width: 100%;
    margin-top: 5px;
    font-size: clamp(42px, 11vw, 58px);
    line-height: 1.04;
    letter-spacing: 0;
    overflow-wrap: anywhere;
    word-break: normal;
    hyphens: auto;
  }

  body.single-mode .word-nav-links {
    padding-top: 4px;
  }

  body.single-mode .details {
    margin-top: 28px;
  }
}
  </style>
</head>

<body>

<div id="colorWash"></div>
  <header>
<div class="compact-search" id="compactSearch">
  <input
    type="search"
    id="compactSearchInput"
    placeholder="écrire un mot français..."
    autocomplete="off"
  >
</div>
    <a href="index.html" class="logo">fendani</a>
    
   

    <div class="header-actions">
      <nav>
       <a href="index.html" class="active">FR</a>
<a href="index-fr.html">TOUS LES MOTS</a>
      </nav>
      <div class="header-counter">
        <span class="counter-number" id="totalWords">—</span>
        <span class="counter-label">entrées</span>
      </div>
    </div>
  </header>

  <main>
<div id="wordImage" class="word-image">
<div id="photoCredit" class="photo-credit"></div>
</div>
    <section class="hero-section">
      <div class="hero-top">
        <div class="eyebrow">LE DICTIONNAIRE FENDANI</div>
      </div>
      <h1>Tous les mots. Ici.</h1>
      
    </section>

   <section class="home-directory" id="homeDirectory">
  
  <input
    type="search"
    id="mainSearch"
    class="header-search"
    placeholder="écrire un mot français..."
    autocomplete="off"
  >
</section>

    <ul class="word-list" id="wordList"></ul>

    <div class="empty" id="empty" style="display:none;">Aucun écho trouvé.</div>
    <div class="error" id="error" style="display:none;">Le dictionnaire (`dictionary.js`) est introuvable.</div>
  </main>

  <script src="dictionary.js"></script>

  <script>
    const wordList = document.getElementById("wordList");
   const mainSearch = document.getElementById("mainSearch");
    const homeDirectory = document.getElementById("homeDirectory");
    const empty = document.getElementById("empty");
    const error = document.getElementById("error");
    const totalWords = document.getElementById("totalWords");

    if (typeof dictionary === "undefined") {
      error.style.display = "block";
    } else {
    totalWords.textContent = dictionary.reduce((total, mot) => {
  const boldWords = (mot.senses || []).reduce((count, sense) => {
    const html = sense.b || "";
    const matches = html.match(/<(?:strong|b)\b[^>]*>[\s\S]*?<\/(?:strong|b)>/gi) || [];

    return count + matches.reduce((sum, match) => {
      const text = match.replace(/<[^>]*>/g, "").trim();
      return sum + (text.match(/\b[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
    }, 0);
  }, 0);

  return total + 1 + boldWords;
}, 0);

      function escapeHTML(value) {
        if (value === undefined || value === null) return "";
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function slugify(text) {
        return String(text || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      function renderDetails(mot) {
        let col1HTML = "";
        let col2HTML = "";

        const lang = new URLSearchParams(window.location.search).get("lang") || "fr";

        

        if (mot.type) col2HTML += `<div class="detail-row"><span class="detail-label">Nature & Genre / <span style="color: #52585B;">Bieve & Lingo </span></span>${escapeHTML(mot.type)}${mot.gender ? " · " + escapeHTML(mot.gender) : ""}</div>`;
if (mot.domain) {
    let urlDomaine = `domaine.html?nom=${encodeURIComponent(mot.domain)}`;
    col2HTML += `
        <div class="detail-row domain-row">
            <span class="detail-label">Domaine</span>
            <span class="detail-value">
                <a href="${urlDomaine}" class="domain-link" style="
                    display: inline-block;
                    background-color: #f0f0f0;
                    color: #005D4C;
                    padding: 4px 10px;
                    border-radius: 20px;
                    text-decoration: none;
                    font-size: 0.9em;
                    font-weight: 500;
                    letter-spacing: -0.15px;
                ">${escapeHTML(mot.domain)}</a>
            </span>
        </div>`;
}

        if (mot.phonetic) col2HTML += `<div class="detail-row"><span class="detail-label">Prononciation</span>${escapeHTML(mot.phonetic)}</div>`;
        if (mot.audio1 || mot.audio2) {
    col2HTML += `<div class="detail-row audio-row"><span class="detail-label">Audio</span>`;
    if (mot.audio1) col2HTML += `<button class="play-audio" onclick="new Audio('${escapeHTML(mot.audio1)}').play()" style="margin-right: 10px;"> <img src="logo.svg" alt=""></button>`;
    if (mot.audio2) col2HTML += `<button class="play-audio" onclick="new Audio('${escapeHTML(mot.audio2)}').play()">🎓</button>`;
    col2HTML += `</div>`;
}

        
        if (mot.etymology) {
          const etymologies = Array.isArray(mot.etymology) ? mot.etymology : [mot.etymology];
          etymologies.forEach((etymology) => {
            if (etymology.source || etymology.meaning) col2HTML += `<div class="detail-row"><span class="detail-label">Étymologie / <span style="color: #52585B;">Nevica</span> ·  ${escapeHTML(etymology.language || "")}</span>
${etymology.source || ""}${etymology.meaning ? " — " + escapeHTML(etymology.meaning) : ""}</div>`;
          });
        }
        if (mot.related && mot.related.length) col2HTML += `<div class="detail-row"><span class="detail-label">Résonances</span><span class="related">${mot.related.map(item => `<span>${escapeHTML(item)}</span>`).join("")}</span></div>`;


 const hasMultipleSenses = mot.senses && mot.senses.length > 0;

if (hasMultipleSenses) {
  col1HTML += `
    <div class="detail-row">
      <span class="detail-label">1. ${escapeHTML(mot.senseLabel || "Général / <span style=\color: #52585B;\>Espleno</span>")}</span>
      ${mot.definition || ""}

      ${mot.examples && mot.examples.length ? `
        <div style="margin-top: 8px;">
          ${mot.examples.map(example => `
  <div style="display:flex; align-items:baseline;">
    ${example.audio ? `
      <button class="play-audio"
        onclick="event.stopPropagation(); new Audio('${escapeHTML(example.audio)}').play()">
        <img src="logo.svg" alt="">
      </button>
    ` : ""}
    <span>${example.text || ""}</span>
  </div>
`).join("")}
        </div>
      ` : ""}
    </div>
  `;

  col1HTML += mot.senses.map((sense, index) => `
    <div class="detail-row">
      <span class="detail-label">
        ${index + 2}. ${escapeHTML(sense.definition || "")}
      </span>
      ${sense.b || ""}

      ${sense.examples && sense.examples.length ? `
        <div style="margin-top: 8px;">
          ${sense.examples.map(example => `
            <div style="margin-bottom: 1px;">
  ${example.audio ? `
  <button class="play-audio"
    onclick="event.stopPropagation(); new Audio('${escapeHTML(example.audio)}').play()">
    <img src="logo.svg" alt="">
  </button>
` : ""}
<span>${example.text || ""}</span>
</div>
          `).join("")}
        </div>
      ` : ""}
    </div>
  `).join("");

} else if (mot.definition) {
  col1HTML += `
    <div class="detail-row">
      <span class="detail-label">Définition / <span style="color: #52585B;">Nevelipe</span></span>
      ${mot.definition || ""}
    </div>
  `;

  if (mot.examples && mot.examples.length) {
    col1HTML += `
      <div class="detail-row">
        <span class="detail-label">Exemple(s) / <span style="color: #52585B;">Equesio(s)</span></span>
        ${mot.examples.map(example => `
         <div style="display: flex; align-items: baseline; gap: 6px;">
  ${example.audio ? `
    <button class="play-audio"
      onclick="event.stopPropagation(); new Audio('${escapeHTML(example.audio)}').play()">
      <img src="logo.svg" alt="">
    </button>
  ` : ""}
  <span>${example.text || ""}</span>
</div>
        `).join("")}
      </div>
    `;
  }
}
        return `
          <div class="monograph-grid">
            <div class="mono-col">${col1HTML}</div>
            <div class="mono-col">${col2HTML}</div>
          </div>
        `;
      }

     const sortedDictionary = [...dictionary].sort((a, b) =>
  (a.fr || "").localeCompare(b.fr || "", "fr", { sensitivity: "base" })
);


      function buildDOM(list) {
        wordList.innerHTML = "";
        empty.style.display = list.length ? "none" : "block";

        list.forEach((mot, index) => {
          const li = document.createElement("li");
          li.className = "word";
          const slug = slugify(mot.b || `mot-${index}`);
          li.dataset.slug = slug;

          const firstLetter = (mot.fr || mot.b || "").charAt(0).toUpperCase();

          const prevIndex = (index - 1 + list.length) % list.length;
          const nextIndex = (index + 1) % list.length;
          const prevSlug = slugify(list[prevIndex].b);
          const nextSlug = slugify(list[nextIndex].b);

          li.innerHTML = `
            <div class="word-card">
              <div class="word-header-bar">
                <div class="word-main">
                  <span class="word-letter">${escapeHTML(firstLetter)}</span>
                   <span class="word-fr">${escapeHTML(mot.fr)}</span>
    <span class="word-name">${escapeHTML(mot.b)}</span>
  </div>
                <div class="word-nav-links">
                  <a href="?mot=${prevSlug}" class="nav-page-link" data-slug="${prevSlug}">← Précédent</a>
                  <a href="?mot=${nextSlug}" class="nav-page-link" data-slug="${nextSlug}">Suivant →</a>
                </div>
              </div>

              <div class="details">
                ${renderDetails(mot)}
              </div>

              <div class="word-footer-info">
                <span>Le dictionnaire Fendani</span>
                <span>${String(index + 1).padStart(3, "0")} / ${String(list.length).padStart(3, "0")}</span>
              </div>
            </div>
          `;

          li.querySelector('.word-card').addEventListener("click", (e) => {
            if (e.target.tagName === 'A' || e.target.tagName === 'AUDIO' || e.target.closest('audio')) return;
            navigateToWord(slug);
          });

          wordList.appendChild(li);
        });

        wordList.querySelectorAll('.nav-page-link').forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            navigateToWord(link.getAttribute('data-slug'));
          });
        });
      }



      function navigateToWord(slug) {
        history.pushState({ mot: slug }, "", `?mot=${slug}`);
        handleRoute();
      }
function setSoftImageColor(imageUrl) {
  const img = new Image();

  img.onload = function () {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 1;
    canvas.height = 1;

    ctx.drawImage(img, 0, 0, 1, 1);

    const pixel = ctx.getImageData(0, 0, 1, 1).data;

    const r = Math.round(pixel[0] + (255 - pixel[0]) * 0.3);
    const g = Math.round(pixel[1] + (255 - pixel[1]) * 0.3);
    const b = Math.round(pixel[2] + (255 - pixel[2]) * 0.3);

    document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
  };

  img.src = imageUrl;
}
      function handleRoute() {
        const params = new URLSearchParams(window.location.search);
        const currentMotSlug = params.get('mot');
document.body.classList.toggle("coreno", currentMotSlug === "coreno");
document.body.classList.toggle("carumbo", currentMotSlug === "carumbo");
document.body.classList.toggle("carumbino", currentMotSlug === "carumbino");

        const allWords = document.querySelectorAll('.word');


        if (currentMotSlug) {
          let found = false;
          if (wordList.children.length === 0) {
            buildDOM(sortedDictionary);
          }

          allWords.forEach(w => {
            if (w.dataset.slug === currentMotSlug) {
              w.classList.add('active-single');
              found = true;
            } else {
              w.classList.remove('active-single');
            }
          });
if (found) {
  document.body.classList.add('single-mode');
  homeDirectory.style.display = "none";
  empty.style.display = "none";

  const currentWord = sortedDictionary.find(
    mot => slugify(mot.b) === currentMotSlug
  );
document.getElementById("photoCredit").textContent =
  currentWord?.credit || "";

 const wordImage = document.getElementById("wordImage");
const photoCredit = document.getElementById("photoCredit");

if (currentWord?.image?.trim()) {
  wordImage.style.backgroundImage = `url("${currentWord.image}")`;
  wordImage.classList.remove("no-image");
  document.body.classList.add("has-image");
  photoCredit.textContent = currentWord.credit || "";
} else {
  wordImage.style.backgroundImage = "none";
  wordImage.classList.add("no-image");
  document.body.classList.remove("has-image");
  photoCredit.textContent = "";
}

document.body.style.backgroundColor =
  currentWord && currentWord.color
    ? currentWord.color
    : "#ffffff";

  return;
}        }

        document.body.classList.remove('single-mode');
        allWords.forEach(w => w.classList.remove('active-single'));
        wordList.innerHTML = "";
        homeDirectory.style.display = "block";
        mainSearch.value = "";
      }

      window.addEventListener('popstate', handleRoute);

      buildDOM(sortedDictionary);
      handleRoute();

      function normalizeWord(text) {
  return String(text || "")
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function normalizeWord(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLocaleLowerCase("fr")
    .trim();
}

function getSearchText(mot) {
  const senses = (mot.senses || [])
    .map(s => [
      s.definition,
      s.b,
      ...(s.examples || []).map(e => e.text)
    ].join(" "))
    .join(" ");

  const related = (mot.related || []).join(" ");

  return normalizeWord([
    mot.fr,
    mot.b,
    mot.definition,
    ...(mot.examples || []).map(e => e.text),
    mot.type,
    mot.domain,
    mot.phonetic,
    related,
    senses
  ].join(" "));
}

function searchDictionary(query) {
  const q = normalizeWord(query);
  if (!q) return [];

  const terms = q.split(/\s+/).filter(Boolean);

  return sortedDictionary
    .map(mot => {
      const french = normalizeWord(mot.fr);
      const calo = normalizeWord(mot.b);
      const fullText = getSearchText(mot);

      let score = 0;

      if (french === q || calo === q) score = 100;
      else if (french.startsWith(q) || calo.startsWith(q)) score = 70;
      else if (terms.every(term => fullText.includes(term))) score = 40;
      else if (fullText.includes(q)) score = 20;

      return { mot, score };
    })
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score)
    .map(item => item.mot);
}

function displaySearchResults(query) {
  const results = searchDictionary(query);

  wordList.innerHTML = "";
  empty.style.display = "none";

  if (!query.trim()) {
    buildDOM(sortedDictionary);
    return;
  }

  if (!results.length) {
    empty.textContent = "Aucun écho trouvé.";
    empty.style.display = "block";
    return;
  }

  buildDOM(results);
}

mainSearch.addEventListener("input", () => {
  displaySearchResults(mainSearch.value);
});

mainSearch.addEventListener("keydown", event => {
  if (event.key !== "Enter") return;

  event.preventDefault();

  const results = searchDictionary(mainSearch.value);

  if (results.length) {
    navigateToWord(slugify(results[0].b));
  } else {
    empty.textContent = "Retentez votre chance.";
    empty.style.display = "block";
  }
});

updateCompactSearch();
  </script>
